# QuantLab Configuration — XAUUSD Momentum Focus

system:
  name: "QuantLab"
  version: "3.0.0"
  mode: "autonomous"
  max_concurrent_backtests: 3
  tick_interval_seconds: 3
  max_retries_per_task: 3

mt5:
  terminal_path: "C:\\Program Files\\MetaTrader 5\\terminal64.exe"
  symbol: "XAUUSD"
  initial_deposit: 10000
  leverage: 100
  spread: 30
  slippage: 5

# Momentum strategies only — MACD, RSI, EMA crossovers
strategy_generation:
  min_strategies_per_cycle: 8
  max_strategies_per_cycle: 20
  symbols:
    - "XAUUSD"
  execution_timeframe: "M1"
  analysis_timeframes:
    - "H1"
    - "M15"
    - "M5"
  patterns:
    - macd_crossover
    - macd_divergence
    - rsi_momentum
    - rsi_reversal
    - ema_crossover
    - ema_triple
    - momentum_breakout
    - macd_rsi_confluence
    - ema_macd_combined
    - multi_tf_momentum

# 2-week rolling windows, most recent first
backtest:
  window_days: 14
  window_step_days: 14
  max_history_days: 365
  start_from_most_recent: true

optimization:
  engine: "optuna"
  n_trials: 150
  target_metric: "sharpe_ratio"
  params_to_optimize:
    stop_loss: {min: 10, max: 200, step: 5}
    take_profit: {min: 20, max: 500, step: 10}
    ema_fast: {min: 5, max: 50, step: 1}
    ema_slow: {min: 20, max: 200, step: 5}
    macd_fast: {min: 8, max: 16}
    macd_slow: {min: 20, max: 30}
    macd_signal: {min: 7, max: 12}
    rsi_period: {min: 7, max: 21}
    rsi_overbought: {min: 65, max: 85}
    rsi_oversold: {min: 15, max: 35}
    atr_period: {min: 7, max: 25}
    atr_multiplier: {min: 0.5, max: 3.0}
    trailing_stop: {min: 5, max: 100, step: 5}
    lot_size: {min: 0.01, max: 0.5, step: 0.01}

validation:
  min_sharpe: 0.8
  max_drawdown_pct: 25
  min_profit_factor: 1.3
  min_trades: 20

ranking:
  weights:
    sharpe_ratio: 0.30
    sortino_ratio: 0.15
    profit_factor: 0.20
    max_drawdown: 0.15
    win_rate: 0.10
    recovery_factor: 0.10

dashboard:
  host: "0.0.0.0"
  port: 8501
  auto_refresh_seconds: 10

logging:
  level: "INFO"
  format: "%(asctime)s | %(levelname)-8s | %(name)-20s | %(message)s"
  max_file_size_mb: 50
  backup_count: 10
