# QuantLab Configuration — FTMO Challenge Focus

system:
  name: "QuantLab"
  version: "4.0.0"
  mode: "autonomous"
  max_concurrent_backtests: 3
  tick_interval_seconds: 3
  max_retries_per_task: 3

mt5:
  terminal_path: "C:\\Program Files\\MetaTrader 5\\terminal64.exe"
  initial_deposit: 100000
  leverage: 100

# FTMO Challenge Rules
ftmo:
  account_size: 100000
  profit_target: 10000
  max_daily_loss: 3000
  max_loss: 10000
  best_day_rule_pct: 50
  reward_pct: 90
  # Risk per trade as % of account
  risk_per_trade_pct: 1.0
  # Max risk per trade in USD
  max_risk_per_trade: 1000

# 5 symbols, 3 strategy types each
symbols:
  - "XAUUSD"
  - "BTCUSD"
  - "ETHUSD"
  - "NAS100"
  - "US500"

strategy_generation:
  min_strategies_per_cycle: 10
  max_strategies_per_cycle: 30
  execution_timeframe: "M1"
  analysis_timeframes:
    - "H1"
    - "M15"
    - "M5"
  # 3 direction types
  directions:
    - "bullish"
    - "bearish"
    - "directional"
  # Momentum patterns for each direction
  patterns:
    bullish:
      - ema_bullish_cross
      - rsi_oversold_bounce
      - macd_bullish_cross
      - break_of_structure_bull
      - fair_value_gap_bull
    bearish:
      - ema_bearish_cross
      - rsi_overbought_reject
      - macd_bearish_cross
      - break_of_structure_bear
      - fair_value_gap_bear
    directional:
      - ema_crossover
      - macd_crossover
      - rsi_momentum
      - momentum_breakout
      - multi_tf_momentum

# 2-week rolling windows
backtest:
  window_days: 14
  window_step_days: 14
  max_history_days: 365
  start_from_most_recent: true
  # Multi-week validation: if passes 1 window, test on more
  validation_weeks: 4

optimization:
  engine: "optuna"
  n_trials: 150
  target_metric: "ftmo_score"
  params_to_optimize:
    stop_loss: {min: 10, max: 200, step: 5}
    take_profit: {min: 20, max: 500, step: 10}
    ema_fast: {min: 5, max: 50, step: 1}
    ema_slow: {min: 20, max: 200, step: 5}
    macd_fast: {min: 8, max: 16}
    macd_slow: {min: 20, max: 30}
    macd_signal: {min: 7, max: 12}
    rsi_period: {min: 7, max: 21}
    rsi_overbought: {min: 65, max: 85}
    rsi_oversold: {min: 15, max: 35}
    atr_period: {min: 7, max: 25}
    atr_multiplier: {min: 0.5, max: 3.0}
    trailing_stop: {min: 5, max: 100, step: 5}
    lot_size: {min: 0.01, max: 0.5, step: 0.01}

validation:
  # FTMO-specific validation
  min_sharpe: 0.8
  max_drawdown_pct: 20
  min_profit_factor: 1.3
  min_trades: 15
  # Must pass FTMO rules
  ftmo_compliant: true
  # Multi-week: must pass at least N of validation weeks
  min_weeks_passed: 3

ranking:
  weights:
    ftmo_score: 0.35
    sharpe_ratio: 0.20
    profit_factor: 0.20
    max_drawdown: 0.15
    win_rate: 0.10

dashboard:
  host: "0.0.0.0"
  port: 8501
  auto_refresh_seconds: 10

logging:
  level: "INFO"
  format: "%(asctime)s | %(levelname)-8s | %(name)-20s | %(message)s"
  max_file_size_mb: 50
  backup_count: 10
